description: Precidian Investments is an industry leader in the creation of innovative financial
  products, specializing in exchange-traded fund (ETF) and mutual fund development. The firm
  is best known for ActiveShares, its patented non-transparent actively managed ETF structure,
  and licenses its proprietary processes, technologies, and structures to financial institutions
  or acts as sponsor for products. Its expertise spans product development, trading, clearance,
  sales, technology, and securities law. Precidian operates as a business-to-business partner to
  asset managers and ETF providers and does not publish a public developer API, developer portal,
  or SDKs. It was surfaced as a portfolio company of Battery Ventures and added to the API
  Evangelist network for enrichment.
